services:
  - type: web
    name: kalakriti-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: /data/artisan_catalog.db
      - key: UPLOAD_DIR
        value: /data/uploads
    disk:
      name: kalakriti-data
      mountPath: /data
      sizeGB: 1